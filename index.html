<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6B65">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning individuel">
<title>Planning individuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F7F6; --surface:#FFFFFF; --ink:#14302E; --muted:#587170; --line:#D4DFDC;
  --accent:#1D6B65; --accent-ink:#FFFFFF; --champ:#3F6F9E;
  --alert:#C4372B; --alert-ink:#FFFFFF; --alert-bg:#FBEAE8;
  --weekend:#E9F0EE; --holiday:#E3ECF6; --chip:#E8EFED; --vac:#F0A04B;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-code:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2322; --surface:#16302E; --ink:#E3EEEC; --muted:#93AAA7; --line:#274643;
    --accent:#56B8AA; --accent-ink:#0F2322; --champ:#8DB4DE;
    --alert:#FF7D6E; --alert-ink:#2A0E0A; --alert-bg:#3A201D;
    --weekend:#132A28; --holiday:#172B3B; --chip:#1E3B39;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F2322; --surface:#16302E; --ink:#E3EEEC; --muted:#93AAA7; --line:#274643;
  --accent:#56B8AA; --accent-ink:#0F2322; --champ:#8DB4DE;
  --alert:#FF7D6E; --alert-ink:#2A0E0A; --alert-bg:#3A201D;
  --weekend:#132A28; --holiday:#172B3B; --chip:#1E3B39;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,label.btn,summary{touch-action:manipulation}
:focus-visible{outline:3px solid var(--champ);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
.visually-hidden{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:6px;padding:10px 10px 8px 14px}
.top h1{flex:1;min-width:0;margin:0;font-size:inherit}
.title{appearance:none;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font-family:var(--f-code);font-weight:700;font-size:29px;line-height:1.1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:left}
.title:disabled{cursor:default}
.iconbtn,.undo{appearance:none;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font:inherit;font-size:14px;font-weight:700}
.iconbtn{width:40px}
.undo{width:40px;padding:0}
.savebtn{appearance:none;position:relative;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);display:inline-flex;align-items:center;gap:5px;cursor:pointer;font:inherit;font-size:14px;font-weight:700}
.savebtn svg{width:19px;height:19px}
.savebtn.due{background:var(--alert);border-color:var(--alert);color:var(--alert-ink)}
@media (max-width:370px){ .savetxt{display:none} .savebtn{width:40px;padding:0;justify-content:center} }
.iconbtn svg,.undo svg{width:20px;height:20px}

/* Planning */
main{padding-bottom:calc(var(--dock,150px) + 14px)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:8px 8px 4px}
.grid.wk{grid-template-columns:20px repeat(7,minmax(0,1fr))}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 3px}
.wkn{display:flex;align-items:center;justify-content:center;font-family:var(--f-code);font-size:12px;color:var(--muted)}
.cell{appearance:none;position:relative;min-height:78px;padding:3px 3px 4px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;overflow:hidden}
.cell.blank{visibility:hidden}
.cell.we{background:var(--weekend)}
.cell.hol{background:var(--holiday);border-top:3px solid var(--champ)}
.ferie{display:block;font-size:10px;font-weight:700;line-height:1.1;color:var(--champ)}
.cell.vac{box-shadow:inset 0 -3px 0 var(--vac)}
.vacline{display:inline-flex;align-items:center;gap:6px}
.vacline::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--vac)}
.cell.hol .num{color:var(--champ);text-decoration:underline;text-underline-offset:2px}
.cell.out{opacity:.42}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:2px;padding-right:9px;min-height:18px}
.num{font-family:var(--f-code);font-weight:600;font-size:15px;line-height:18px;padding:0 4px;border-radius:999px}
.cell.today .num{background:var(--ink);color:var(--bg);text-decoration:none}
.marks{display:flex;gap:2px;align-items:center;line-height:1}
.mk-note{width:7px;height:7px;border-radius:50%;background:var(--champ)}
.mk-iv{font-size:10px}
.mk-ex{font-size:12px;font-weight:700;color:var(--accent)}
.exitem{display:flex;gap:6px;align-items:flex-start}
.exitem .aitem{flex:1}
.mk-hs{font-family:var(--f-code);font-weight:700;font-size:13px;color:var(--accent)}
.mk-pin svg{display:block;width:9px;height:11px}
.cell.chg{border:1.5px dashed var(--champ)}
.cell.alert::after{content:"";position:absolute;top:0;right:0;border-top:13px solid var(--alert);border-left:13px solid transparent}
.stamps{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px}
.stamp{display:block;font-family:var(--f-code);font-weight:700;font-size:23px;line-height:1;text-align:center;padding:7px 0 6px;border-radius:4px;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
.stamps.two .stamp{font-size:15px;padding:3px 0 2px}
.stamps.three .stamp{font-size:12px;padding:2px 0 1px}
.stamps.one .stamp{padding:5px 0 4px}
.stamp .t{display:block;font-size:11px;font-weight:600;letter-spacing:0;margin-top:2px;opacity:.9}
.stamp .t.in{display:inline;font-size:10px;margin:0 0 0 3px}
.nt{display:block;font-size:10px;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--champ);margin:0 3px 1px 1px;vertical-align:middle}
.stamps .stamp.long{font-size:17px}
.stamps.two .stamp.long{font-size:12px}
.stamps.three .stamp.long{font-size:10px}
.hrs{font-family:var(--f-code);font-weight:600;font-size:11px;line-height:1;text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden}
.stamp.sm{display:inline-block;min-width:42px;font-size:18px;padding:5px 7px}
.stamp.sq{display:inline-block;min-width:32px;font-size:16px;padding:4px 5px}
.stamp.lg{display:inline-block;min-width:78px;font-size:36px;padding:10px 14px}
.stamp.empty{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted);color:var(--muted)}
button.stamp{appearance:none;border:0;cursor:pointer}
.summary{appearance:none;display:flex;flex-wrap:wrap;gap:4px 16px;width:calc(100% - 16px);margin:6px 8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.summary strong{font-family:var(--f-code);font-size:19px;font-weight:700;margin-right:2px}
.summary .warn{color:var(--alert)}

/* Barre du bas */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.hint-line{margin:0;padding:8px 12px 0;font-size:13px;color:var(--muted)}
.palette{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.palette::-webkit-scrollbar{display:none}
.chip{appearance:none;flex:0 0 auto;min-width:46px;height:42px;padding:0 10px;border:0;border-radius:8px;font-family:var(--f-code);font-weight:700;font-size:19px;letter-spacing:.02em;cursor:pointer}
.chip.tool{background:var(--chip);color:var(--ink);font-family:var(--f-body);font-size:14px}
.chip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

/* Vues */
.view{padding:14px 14px 0}
.vp{padding:0}
.block{margin:4px 0 26px}
.block > h2{font-family:var(--f-code);font-weight:700;font-size:23px;line-height:1.15;margin:0 0 6px}
.block > h3{font-size:15px;margin:0 0 8px}
.hint{font-size:14px;color:var(--muted);margin:0 0 10px;max-width:62ch}
.empty{color:var(--muted);margin:6px 0}
.lead{padding:4px 0 16px;border-bottom:2px solid var(--ink);margin-bottom:4px}
.lead-main{margin:0;font-size:16px}
.lead-main strong{font-family:var(--f-code);font-weight:700;font-size:54px;line-height:1;margin-right:8px}
.lead-sub{margin:6px 0 0;color:var(--muted)}
.lead-sub strong{font-family:var(--f-code);font-size:20px}
.pos{color:var(--accent)}
.neg{color:var(--alert)}
.ledger{margin:0 0 26px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow .v{font-family:var(--f-code);font-weight:700;font-size:23px;text-align:right}
.lrow .s{grid-column:1/-1;font-size:13px;color:var(--muted)}
.lrow .s.warn{color:var(--alert)}
.counts{display:flex;flex-wrap:wrap;gap:10px 14px}
.count{display:inline-flex;align-items:center;gap:6px}
.cn{font-family:var(--f-code);font-size:19px;font-weight:600}
.aitem{appearance:none;display:flex;gap:10px;width:100%;text-align:left;background:var(--alert-bg);color:var(--ink);border:0;border-left:3px solid var(--alert);border-radius:6px;padding:9px 10px;margin-bottom:6px;font:inherit;font-size:14px;cursor:pointer}
.ad{font-weight:700;white-space:nowrap}
.cycle{padding:12px 0;border-bottom:1px solid var(--line)}
.cycle h3{margin:0 0 8px;font-size:16px}
.seq{display:flex;flex-wrap:wrap;gap:4px}
.row-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.typelist{display:grid}
.typeline{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.typeline .typerow{border-bottom:0;flex:1;min-width:0}
.tr-n{font-family:var(--f-code);font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.mv{display:flex;gap:4px}
.mv .btn{min-width:36px;padding:6px 8px}
.mv .btn:disabled{opacity:.35;cursor:default}
.typerow{appearance:none;display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.tr-txt{flex:1;display:grid;min-width:0}
.tr-l{font-weight:700}
.tr-s{font-size:13px;color:var(--muted)}
.tr-go{color:var(--muted);font-size:22px;line-height:1}
.stack{display:grid;gap:8px;justify-items:start}
.tablewrap{overflow-x:auto;margin:12px 0 8px}
table.qt{width:100%;border-collapse:collapse;font-size:14px}
table.qt th,table.qt td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.qt th{font-weight:400;color:var(--muted);font-size:13px}
table.qt th:first-child,table.qt td:first-child{text-align:left}
table.qt td{font-family:var(--f-code);font-size:18px;font-weight:600}
table.qt tr.cur td{background:var(--chip);font-weight:700}
.readout{font-size:15px;margin:10px 0}
.readout strong{font-family:var(--f-code);font-size:19px}

/* Formulaires */
.btn{appearance:none;font:inherit;font-size:15px;font-weight:700;border-radius:10px;padding:11px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--alert);border-color:var(--alert);color:var(--alert-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 11px;font-size:13px}
.linkbtn{appearance:none;background:none;border:0;padding:6px 0;color:var(--champ);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.form{display:grid;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.f-l{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-height:44px;min-width:0}
textarea{resize:vertical}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:3px;cursor:pointer}
.tstep{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.tstep .btn{min-width:48px;height:44px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;margin:0;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:8px 2px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg input:checked + label{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input:focus-visible + label{outline:3px solid var(--champ);outline-offset:1px}

/* Feuille modale */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(6,18,17,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:560px;max-height:90%;overflow:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease-out}
.sheet.open .panel{transform:none}
.panel h2{font-family:var(--f-code);font-weight:700;font-size:27px;line-height:1.1;margin:0 0 6px}
.panel h2:focus{outline:none}
.panel .block{margin:18px 0 0}
.meta{color:var(--muted);margin:0 0 6px}
.alertbox{background:var(--alert-bg);border-left:3px solid var(--alert);border-radius:6px;padding:8px 10px;margin:10px 0 0}
.alertbox p{margin:2px 0;font-size:14px}
.ccard{border-left:4px solid var(--c,var(--line));padding:2px 0 12px 12px;margin:10px 0 14px}
.ccard .form{margin-top:8px}
.dayrow{display:flex;align-items:center;gap:12px;padding:6px 0}
.dr-txt{flex:1;min-width:0}
.dr-l{font-weight:700}
.dr-s{font-size:13px;color:var(--muted)}
details.hs{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
details.hs summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0;color:var(--accent)}
.ivrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;align-items:center;gap:6px;margin-bottom:8px}
.ivdur{font-family:var(--f-code);font-weight:700;font-size:18px;min-width:44px;text-align:right}
.dprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.dprow .full{grid-column:1/-1}
.editor-head{margin:8px 0 14px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.plan-state{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 8px 0;font-size:13px;color:var(--muted)}
.planbox{background:var(--chip);border-radius:8px;padding:8px 10px;margin:10px 0 0;font-size:14px}
.planbox.diff{background:var(--holiday);border-left:3px solid var(--champ)}
.planbox p{margin:2px 0}
.logitem{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.ivblock{border-left:3px solid var(--line);padding:2px 0 4px 10px;margin:0 0 14px}
.ivblock .form{gap:8px}
.ivfoot{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ivfoot p{margin:0}
.qprev{display:flex;flex-wrap:wrap;gap:8px 6px}
.qday{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-width:38px}
.stamp.bad{background:var(--alert-bg);color:var(--alert);box-shadow:inset 0 0 0 1.5px var(--alert)}
.nb h3{font-size:16px;margin:18px 0 6px}
.nb ul{margin:0;padding-left:18px}
.guide{margin:6px 0 10px;padding-left:18px}
.guide li{margin:6px 0;font-size:15px;line-height:1.45}
.nb li{margin:6px 0;font-size:15px;line-height:1.45}
table.an th,table.an td{padding:6px 3px}
table.an td{font-size:16px}
.tablewrap.flush{margin:4px 0 6px}
#toast{position:fixed;left:50%;bottom:calc(var(--dock,140px) + 14px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:80;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){
  .panel,#toast,.switch,.switch::after{transition:none}
}
@media (min-width:700px){
  .cell{min-height:94px}
  .stamp{font-size:28px}
  .stamp .t{font-size:12px}
  .nt{font-size:11px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap toprow">
    <h1><button id="title" class="title" type="button" title="Revenir au mois en cours"></button></h1>
    <button id="undo" class="undo" type="button" hidden aria-label="Annuler la dernière modification">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="saveBtn" class="savebtn" type="button" hidden aria-label="Sauvegarder mes données" title="Sauvegarder mes données">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/></svg><span class="savetxt">Sauvegarder</span>
    </button>
    <button id="prev" class="iconbtn" type="button" aria-label="Mois précédent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    </button>

function absSection(v, st){
  var y = cur.y, ay = absYear(y), rows = [];
  state.types.forEach(function(t){
    if (t.kind !== 'absence' || t.code === 'RTT') return;
    var q = entitlement(t, y), su = t.period === 'since' ? sinceUsage(t) : null;
    if (t.autoFrac && !q && !(ay.used[t.id])) { if (!ay.horsSaison) return; }
    var used = su ? su.used : (ay.used[t.id] || 0);
    if (!used && q === null) return;
    var subs = [], warn = false;
    if (q !== null && t.period === 'since' && !su) subs.push('Indiquer le début de la période de 36 mois dans le code (Réglages)');
    else if (q !== null) {
      subs.push('reste ' + fmtNum(Math.round((q - used) * 10) / 10) + ' j' + (t.prorata ? ', droits à ' + state.settings.quotite + ' %' : ''));
      if (used > q) warn = true;
    }
    if (su) subs.push('période du ' + dateFr(t.since) + ' au ' + dateFr(su.end));
    if (t.code === 'CA' && ay.horsSaison) {
      var b = ay.horsSaison >= 8 ? 2 : ay.horsSaison >= 5 ? 1 : 0;
      subs.push(fmtNum(ay.horsSaison) + ' j posés hors mai-octobre' + (b ? ', soit ' + b + ' j de fractionnement à poser en CPF' : ', 5 j donnent droit à 1 jour de fractionnement'));
    }
    if (t.autoFrac) subs.push('droits acquis avec les CA posés hors mai-octobre : 1 jour de 5 à 7 jours, 2 jours à partir de 8');
    if (t.code === 'MAL' && ay.malEp) subs.push(ay.malEp + ' arrêt' + (ay.malEp > 1 ? 's' : '') + ' distinct' + (ay.malEp > 1 ? 's' : ''));
    if (t.code === 'CPP') {
      var mU = st.abs[t.id] || 0;
      if (mU) { subs.push('ce mois : ' + fmtNum(mU) + ' j, l’AJPP en indemnise 22 au plus'); if (mU > 22) warn = true; }
    }
    var M = ay.motifs[t.id];
    if (M) Object.keys(M).forEach(function(m){ subs.push(m + ' : ' + fmtNum(M[m]) + ' j'); });
    rows.push(el('div', {class:'lrow'}, el('span', null, t.label),
      el('span', {class:'v'}, fmtNum(used) + (q !== null ? ' / ' + fmtNum(q) : '') + ' j'),
      subs.length ? el('span', {class:'s' + (warn ? ' warn' : '')}, cap(subs.join(', ')) + '.') : null));
  });
  if (rows.length) v.append(sec('Congés et absences ' + y, el('div', {class:'ledger'}, rows),
    'Jours posés sur l’année (ou sur la période de 36 mois), demi-journées comprises. Les droits proratisés suivent la quotité.'));
}

/* Cycles */
function seqView(pattern, onTap){
  var box = el('div', {class:'seq'});
  pattern.forEach(function(id, i){
    var t = id === '_' ? null : typeById(id);
    var tag = onTap ? 'button' : 'span';
    var s = t
      ? el(tag, {class:'stamp sq', style:chipStyle(t), type:onTap ? 'button' : null, 'aria-label':onTap ? 'Retirer ' + t.label + ', jour ' + (i + 1) : null}, t.code)
      : el(tag, {class:'stamp sq empty', type:onTap ? 'button' : null, 'aria-label':onTap ? 'Retirer le jour libre ' + (i + 1) : 'Jour libre'}, '·');
    if (onTap) s.addEventListener('click', function(){ onTap(i); });
    box.append(s);
  });
  return box;
}
function renderCycles(){
  var v = $('#view-cycles'); v.textContent = '';

}
function openCycleEditor(id){

    });

    panel.append(sec('Ajouter à la suite', chips, 'Toucher les codes dans l’ordre du cycle. Un jour libre laisse le planning tel quel.', 'h3'));

function openApply(id){
  var c = null;
  state.cycles.forEach(function(x){ if (x.id === id) c = x; });
  if (!c || !c.pattern.length) return;
  var o = {from:mkKey(cur.y, cur.m, 1), to:mkKey(cur.y, cur.m, daysInMonth(cur.y, cur.m)), offset:0, over:false};
  openSheet(function(panel){
    panel.append(sheetTitle('Appliquer « ' + c.name + ' »'), seqView(c.pattern));
    var from = el('input', {type:'date', value:o.from}); from.addEventListener('change', function(){ o.from = from.value; });
    var to = el('input', {type:'date', value:o.to}); to.addEventListener('change', function(){ o.to = to.value; });
    var off = el('select');
    c.pattern.forEach(function(pid, i){
      var t = typeById(pid);
      off.append(el('option', {value:String(i)}, 'Jour ' + (i + 1) + ' du cycle' + (t ? ' (' + t.code + ')' : ' (libre)')));
    });
    off.value = String(o.offset);
    off.addEventListener('change', function(){ o.offset = +off.value; });
    panel.append(el('div', {class:'form', style:'margin-top:14px'},
      el('div', {class:'two'}, field('Du', from), field('Au', to)),
      field('Le premier jour correspond au', off),
      switchRow('Remplacer les jours déjà remplis', o.over, function(val){ o.over = val; }),
      el('p', {class:'hint', style:'margin:0'}, 'Les jours déjà posés par ce cycle sont toujours remis à jour : modifier le cycle puis le réappliquer suffit. Les autres jours remplis ne bougent pas, sauf avec « Remplacer ».')));
    panel.append(el('div', {class:'sheet-actions'},
      el('button', {type:'button', class:'btn ghost', onclick:function(){
        var re0 = /^\d{4}-\d{2}-\d{2}$/;
        if (!re0.test(o.from) || !re0.test(o.to) || o.to < o.from) { toast('Choisir les deux dates.'); return; }
        askConfirm('Retirer du planning les jours posés par « ' + c.name + ' » entre le ' + dateFr(o.from) + ' et le ' + dateFr(o.to) + ' ? Les jours modifiés à la main restent.', 'Retirer', function(){
          var n0 = unapplyCycle(c, dayIdx(o.from), dayIdx(o.to)); closeSheet(); toast(n0 + ' jour' + (n0 > 1 ? 's retirés' : ' retiré') + '.');
        });
      }}, 'Retirer ce cycle'),
      el('button', {type:'button', class:'btn ghost', onclick:closeSheet}, 'Retour'),
      el('button', {type:'button', class:'btn primary', onclick:function(){
        var re = /^\d{4}-\d{2}-\d{2}$/;
        if (!re.test(o.from) || !re.test(o.to)) { toast('Choisir les deux dates.'); return; }
        var a = dayIdx(o.from), b = dayIdx(o.to);
        if (b < a) { toast('La date de fin précède la date de début.'); return; }
        if (b - a > 400) { toast('Période limitée à 400 jours.'); return; }
        var run = function(over){
          var n = applyCycle(c, a, b, o.offset, over);
          var p = parseKey(o.from); cur = {y:p.y, m:p.m};
          view = 'planning'; closeSheet(); window.scrollTo(0, 0);
          toast(n ? n + ' jour' + (n > 1 ? 's' : '') + ' rempli' + (n > 1 ? 's' : '') + '.' : 'Aucun jour modifié.');
        };
        var conf = o.over ? 0 : cycleConflicts(c, a, b, o.offset);
        if (conf) askReplace(conf, run); else run(o.over);
      }}, 'Appliquer le cycle')));
  });
}

function parseQuick(text){
  return String(text || '').trim().split(/[\s,;]+/).filter(Boolean).map(function(tok){
    if (/^[.\-_·]$/.test(tok)) return {skip:true, tok:tok};
    if (/^(0|x|vide)$/i.test(tok)) return {clear:true, tok:tok};
    var ids = [], bad = null;
    tok.split('+').filter(Boolean).forEach(function(c){
      var t = state.types.filter(function(x){ return x.code.toUpperCase() === c.toUpperCase(); })[0];
      if (t) ids.push(t.id); else bad = c;
    });
    return bad !== null || !ids.length ? {bad:bad || tok, tok:tok} : {ids:ids, tok:tok};
  });
}
function applyQuick(fromK, toks, over){
  pushUndo();
  var a = dayIdx(fromK), n = 0;
  toks.forEach(function(q, i){
    if (q.skip || q.bad) return;
    var k = keyFromIdx(a + i), ent = state.days[k];
    if (q.clear) { if (ent && ent.s && ent.s.length) { eraseDay(k); n++; } return; }
    if (ent && ent.s && ent.s.length && !over) return;
    var e2 = ent || {}; e2.s = []; delete e2.o; delete e2.iv; state.days[k] = e2;
    q.ids.forEach(function(id){ toggleType(k, id); });
    n++;
  });
  save();
  return n;
}
function openQuick(o0){
  var first = mkKey(cur.y, cur.m, 1);
  var o = o0 || {from:todayKey.slice(0, 7) === first.slice(0, 7) ? keyFromIdx(dayIdx(todayKey) - dow(todayKey)) : first, text:'', over:false};
  openSheet(function(panel){
    panel.append(sheetTitle('Saisie rapide'),
      el('p', {class:'hint'}, 'Taper les codes jour après jour, séparés par des espaces : « M M S RH N ». « J+A » pour un poste et une astreinte, « . » pour sauter un jour, « 0 » pour le vider.'));
    var from = el('input', {type:'date', value:o.from});
    var ta = el('textarea', {rows:'3', autocapitalize:'characters', autocomplete:'off', spellcheck:'false', placeholder:'M M S S RH RH N', 'aria-label':'Codes à saisir'});
    ta.value = o.text;
    var prev = el('div', {class:'qprev', 'aria-live':'polite'}), newBox = el('div');
    var draw = function(){
      prev.textContent = ''; newBox.textContent = '';
      var unk = parseQuick(o.text).filter(function(q){ return q.bad; }).map(function(q){ return q.bad.toUpperCase(); }).filter(function(c, i, a){ return a.indexOf(c) === i && c.length <= 4 && !/[+.]/.test(c); });
      if (unk.length) newBox.append(el('div', {class:'chips'}, unk.slice(0, 4).map(function(c){
        return el('button', {type:'button', class:'chip tool', onclick:function(){
          openTypeEditor(null, {prefill:{code:c, label:c}, title:'Créer le code ' + c, intro:'Code inconnu dans la saisie : lui donner sa nature et ses horaires, puis revenir à la saisie.',
            onCancel:function(){ openQuick(o); }, onSaved:function(){ openQuick(o); }});
        }}, 'Créer ' + c);
      })));
      if (!/^\d{4}-\d{2}-\d{2}$/.test(o.from)) return;
      var a = dayIdx(o.from);
      parseQuick(o.text).slice(0, 93).forEach(function(q, i){
        var k = keyFromIdx(a + i), inner;
        if (q.bad) inner = el('span', {class:'stamp sq bad'}, q.tok);
        else if (q.skip) inner = el('span', {class:'stamp sq empty'}, '·');
        else if (q.clear) inner = el('span', {class:'stamp sq empty'}, '0');
        else inner = q.ids.map(function(id){ return stamp(typeById(id), 'sq'); });
        prev.append(el('span', {class:'qday'}, el('span', null, WDS[dow(k)] + ' ' + parseKey(k).d), inner));
      });
    };
    from.addEventListener('change', function(){ o.from = from.value; draw(); });
    ta.addEventListener('input', function(){ o.text = ta.value; draw(); });
    panel.append(el('div', {class:'form', style:'margin-top:10px'}, field('À partir du', from), field('Codes', ta), prev, newBox,
      switchRow('Remplacer les jours déjà remplis', o.over, function(val){ o.over = val; })));
    draw();
    panel.append(el('div', {class:'sheet-actions'},
      el('button', {type:'button', class:'btn ghost', onclick:closeSheet}, 'Retour'),
      el('button', {type:'button', class:'btn primary', onclick:function(){
        var toks = parseQuick(o.text);
        if (!toks.length) { toast('Taper au moins un code.'); return; }
        var bad = toks.filter(function(q){ return q.bad; });
        if (bad.length) { toast('Code inconnu : ' + bad[0].bad + '.'); return; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(o.from)) { toast('Choisir la date de départ.'); return; }
        var runQ = function(over){
          var n = applyQuick(o.from, toks, over), p = parseKey(o.from);
          cur = {y:p.y, m:p.m}; view = 'planning'; closeSheet();
          toast(n ? n + ' jour' + (n > 1 ? 's' : '') + ' rempli' + (n > 1 ? 's' : '') + '.' : 'Aucun jour modifié.');
        };
        var confQ = 0;
        if (!o.over) toks.forEach(function(tk, i){ if (tk && tk.ids && tk.ids.length) { var e = state.days[keyFromIdx(dayIdx(o.from) + i)]; if (e && (e.s || []).length) confQ++; } });
        if (confQ) askReplace(confQ, runQ); else runQ(o.over);
      }}, 'Remplir')));
  });
}

function fileSafe(x){ return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9-]+/g, '-').replace(/^-+|-+$/g, ''); }
function pdfFileName(kind, y, m){

  if (S.fileIdent !== false) parts.push(fileSafe((S.agentNom || '').toUpperCase()), fileSafe(S.agentPrenom), fileSafe(S.agentMat));

}
function cleanPdfName(v, fallback){

  if (!x) x = fallback;

      var rgb = hexRgb(t.color), ink = hexRgb(inkOn(t.color));
      doc.setFillColor(rgb[0], rgb[1], rgb[2]); doc.roundedRect(lx, lyy, 10, 4.4, 0.7, 0.7, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(ink[0], ink[1], ink[2]); doc.text(T(t.code), lx + 5, lyy + 3.2, {align:'center'});
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.4); doc.setTextColor(30);
      doc.text(fit(t.label + (t.start && t.end ? ', ' + fmtClock(t.start) + '-' + fmtClock(t.end) : ''), W / 4 - 13), lx + 12, lyy + 3.2);
      doc.setTextColor(0);
    });
    doc.setFontSize(7); doc.setTextColor(110);
    doc.text(T('Établi le ' + todayTxt + '.'), L, PH - 7);
    doc.setTextColor(0);
  }
  return doc;
}

/* Vacances ajoutées à la main ou importées (.ics) */
function vacCustomBlock(){
  var S = state.settings, wrap = el('div', {style:'margin-top:10px'});
  var list = (S.customVac || []).slice().sort(function(a, b){ return a.from < b.from ? -1 : 1; });
  if (list.length) wrap.append(el('h3', {style:'font-size:15px;margin:6px 0'}, 'Dates ajoutées'));
  list.forEach(function(c){
    var nm = el('input', {type:'text', value:c.name || '', placeholder:'Vacances de la Toussaint', autocomplete:'off'});
    nm.addEventListener('change', function(){ c.name = nm.value.trim(); save(); });
    var fr = el('input', {type:'date', value:c.from || ''}); fr.addEventListener('change', function(){ c.from = fr.value; save(); });
    var to = el('input', {type:'date', value:c.to || ''}); to.addEventListener('change', function(){ c.to = to.value; save(); });

  });
  var fi = el('input', {type:'file', accept:'.ics,text/calendar', class:'visually-hidden', id:'icsVac'});
  fi.addEventListener('change', function(){
    var f = fi.files && fi.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      fi.value = '';
      var got = parseIcsVac(r.result), known = vacList();
      var fresh = got.filter(function(g){ return !known.some(function(v){ return v[1] === g.from && v[2] === g.to; }); });
      if (!got.length) { toast('Aucune période trouvée dans ce fichier.'); return; }
      if (!fresh.length) { toast('Toutes ces dates sont déjà dans l’app.'); return; }

          el('div', null, fresh.slice(0, 40).map(function(g){ return el('p', {class:'tr-s', style:'margin:4px 0'}, g.name + ' : ' + vacRange(['', g.from, g.to])); })),
          el('div', {class:'sheet-actions'},
            el('button', {type:'button', class:'btn ghost', onclick:closeSheet}, 'Retour'),
            el('button', {type:'button', class:'btn primary', onclick:function(){
              S.customVac = (S.customVac || []).concat(fresh.map(function(g){ return {id:uid(), name:g.name, from:g.from, to:g.to}; }));
              save(); closeSheet(); toast(fresh.length + ' période' + (fresh.length > 1 ? 's ajoutées' : ' ajoutée') + '.');
            }}, 'Importer')));
      });
    };
    r.readAsText(f);
  });
  var imp = el('label', {for:'icsVac', class:'btn ghost', role:'button', tabindex:'0'}, 'Importer un fichier .ics');
  imp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } });
  wrap.append(el('div', {class:'row-actions'},
    el('button', {type:'button', class:'btn ghost', onclick:function(){
      S.customVac = S.customVac || [];
      S.customVac.push({id:uid(), name:'', from:'', to:''}); save(); renderSettings();
    }}, 'Ajouter des dates'), fi, imp));
  wrap.append(el('p', {class:'hint', style:'margin-top:8px'}, 'Pour les années suivantes : saisir chaque période (premier et dernier jour sans classe), ou importer le fichier agenda .ics de sa zone, publié avec chaque nouveau calendrier scolaire.'));
  return wrap;
}

/* Poser ou effacer sur une période */
function absCreditTxt(t, k){
  var mode = t.creditMode || 'theo';
  if (mode === 'none') return 'ne compte aucune heure';
  if (mode === 'fixed') return 'compte ' + fmtH(Math.round((num(t.credit) || 0) * 60)) + ' par jour';
  if (mode === 'plan') return 'compte les heures du poste prévu';
  return 'compte ' + fmtH(k ? dueDayAt(k) : dueDay()) + ' par jour travaillé (quotité ' + Math.round((k ? quotAt(k) : quot()) * 100) + ' %)';
}
function unapplyCycle(c, a, b){
  pushUndo();
  var n = 0;
  for (var i = a; i <= b; i++) {
    var k = keyFromIdx(i), ent = state.days[k];
    if (ent && ent.cy === c.id) { ent.s = []; delete ent.o; delete ent.iv; delete ent.cy; clean(k); n++; }
  }
  save();
  return n;
}
function openRange(preset){
  var o = {code:preset === 'erase' ? 'erase' : '', from:todayKey, to:keyFromIdx(dayIdx(todayKey) + 4), days:'week', over:true, half:false, cr:'', only:'', keepHol:true};
  var countDays = function(){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(o.from) || !/^\d{4}-\d{2}-\d{2}$/.test(o.to) || o.to < o.from) return 0;
    var n = 0, a = dayIdx(o.from), b = Math.min(dayIdx(o.to), a + 400);
    for (var i = a; i <= b; i++) if (rangeDayOk(keyFromIdx(i), o)) n++;
    return n;
  };
  openSheet(function(panel){
    var t = o.code && o.code !== 'erase' ? typeById(o.code) : null;
    panel.append(sheetTitle(o.code === 'erase' ? 'Effacer sur une période' : 'Poser sur une période'),
      el('p', {class:'hint'}, 'Un arrêt d’une semaine, des congés, ou pour vider une période d’un seul coup.'));
    var chips = el('div', {class:'chips'});
    orderedTypes().forEach(function(x){ chips.append(el('button', {type:'button', class:'chip', style:chipStyle(x), 'aria-pressed':String(o.code === x.id), onclick:function(){ o.code = x.id; sheetRefresh(); }}, x.code)); });
    chips.append(el('button', {type:'button', class:'chip tool', 'aria-pressed':String(o.code === 'erase'), onclick:function(){ o.code = 'erase'; sheetRefresh(); }}, 'Effacer'));
    panel.append(fieldDiv('Code', chips));
    var from = el('input', {type:'date', value:o.from}), to = el('input', {type:'date', value:o.to});
    var info = el('p', {class:'hint', style:'margin:0'});
    var refresh = function(){ var n = countDays(); info.textContent = n + ' jour' + (n > 1 ? 's' : '') + ' concerné' + (n > 1 ? 's' : '') + '.'; };
    from.addEventListener('change', function(){ o.from = from.value; refresh(); });
    to.addEventListener('change', function(){ o.to = to.value; refresh(); });
    panel.append(el('div', {class:'form', style:'margin-top:14px'},
      el('div', {class:'two'}, field('Du', from), field('Au', to)),
      fieldDiv('Quels jours', segmented('rgd', [['week', 'Lundi-vendredi'], ['planned', 'Jours prévus'], ['all', 'Tous']], o.days, function(v){ o.days = v; sheetRefresh(); }, 'Quels jours')),
      el('p', {class:'hint', style:'margin:0'}, o.days === 'week' ? 'Samedis, dimanches et fériés restent tels quels.' : o.days === 'planned' ? 'Seulement les jours où un poste est déjà prévu : les RH et jours libres ne bougent pas.' : 'Tous les jours de la période, week-ends compris.'),
      info));
    refresh();
    if (o.code === 'erase') {
      var only = el('div', {class:'chips'});
      only.append(el('button', {type:'button', class:'chip tool', 'aria-pressed':String(!o.only), onclick:function(){ o.only = ''; sheetRefresh(); }}, 'Tout'));
      orderedTypes().forEach(function(x){ only.append(el('button', {type:'button', class:'chip', style:chipStyle(x), 'aria-pressed':String(o.only === x.id), onclick:function(){ o.only = x.id; sheetRefresh(); }}, x.code)); });
      panel.append(el('div', {class:'form', style:'margin-top:14px'}, fieldDiv('Effacer seulement', only)));
    } else if (t) {
      var extra = [switchRow('Remplacer les jours déjà remplis', o.over, function(v){ o.over = v; })];
      if (t.kind === 'absence') {
        var cr = el('input', {type:'text', inputmode:'decimal', autocomplete:'off', value:o.cr, placeholder:'Automatique'});
        cr.addEventListener('input', function(){ o.cr = cr.value; });
        if (o.days !== 'week') extra.push(switchRow('Laisser les fériés en férié (le poste prévu est retiré)', o.keepHol, function(v){ o.keepHol = v; sheetRefresh(); }));
        extra.push(switchRow('Demi-journées', o.half, function(v){ o.half = v; }),
          el('div', {class:'field'}, field('Heures comptées par jour', cr),
            el('p', {class:'hint', style:'margin:0'}, t.code + ' ' + absCreditTxt(t, o.from) + ' ; demi-journée : la moitié. Laisser vide pour ce calcul, ou saisir une valeur (3h30, 7h…).')));
      }
      panel.append(el('div', {class:'form', style:'margin-top:14px'}, extra));
    }
    panel.append(el('div', {class:'sheet-actions'},
      el('button', {type:'button', class:'btn ghost', onclick:closeSheet}, 'Retour'),
      el('button', {type:'button', class:'btn primary', onclick:function(){
        if (!o.code) { toast('Choisir un code, ou Effacer.'); return; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(o.from) || !/^\d{4}-\d{2}-\d{2}$/.test(o.to)) { toast('Choisir les deux dates.'); return; }
        if (o.to < o.from) { toast('La date de fin précède la date de début.'); return; }
        var crv = null;
        if (o.cr && String(o.cr).trim()) { crv = parseHours(o.cr); if (crv === null) { toast('Heures au format 3h30 ou 3,5.'); return; } }
        var n = applyRange(o, crv), p = parseKey(o.from);
        cur = {y:p.y, m:p.m}; view = 'planning'; closeSheet();
        toast(n ? n + ' jour' + (n > 1 ? 's modifiés' : ' modifié') + '.' : 'Aucun jour modifié.');
      }}, 'Appliquer')));
  });
}
function rangeDayOk(k, o){
  if (o.days === 'week') return dow(k) < 5 && !holidayName(k);
  if (o.days === 'planned') { var e = state.days[k]; return !!(e && (e.s || []).some(function(id){ var t = typeById(id); return t && (t.kind === 'work' || t.kind === 'extra' || t.kind === 'astreinte'); })); }
  return true;
}
function applyRange(o, crv){
  pushUndo();
  var a = dayIdx(o.from), b = Math.min(dayIdx(o.to), a + 400), n = 0, t = o.code !== 'erase' ? typeById(o.code) : null;
  for (var i = a; i <= b; i++) {
    var k = keyFromIdx(i);
    if (!rangeDayOk(k, o)) continue;
    var ent = state.days[k];
    if (o.code === 'erase') {
      if (!ent || !(ent.s || []).length) continue;
      if (o.only) { if (ent.s.indexOf(o.only) < 0) continue; ent.s = ent.s.filter(function(x){ return x !== o.only; }); dropO(ent, o.only); delete ent.cy; clean(k); }
      else { delete ent.cy; eraseDay(k); }
      n++; continue;
    }
    if (!t) continue;
    if (t.kind === 'absence' && o.keepHol && holidayName(k)) {
      var isPostId = function(id){ var x = typeById(id); return x && (x.kind === 'work' || x.kind === 'extra' || x.kind === 'astreinte'); };
      if (ent && (ent.s || []).some(isPostId)) { ent.s.filter(isPostId).forEach(function(id){ dropO(ent, id); }); ent.s = ent.s.filter(function(id){ return !isPostId(id); }); delete ent.iv; delete ent.cy; clean(k); n++; }
      continue;
    }
    var filled = ent && (ent.s || []).length;
    if (filled && !o.over && o.days !== 'planned') continue;
    if (!(ent && (ent.s || []).indexOf(t.id) >= 0)) toggleType(k, t.id);
    if (t.kind === 'absence') {
      var patch = {};
      if (crv !== null) patch.cr = crv;
      if (o.half) patch.half = true;
      if (Object.keys(patch).length) setO(k, t.id, patch);
    }
    if (state.days[k]) delete state.days[k].cy;
    n++;
  }
  save();
  return n;
}
