<!DOCTYPE html>

<style>
:root{
  --bg:#141410; --ink:#ede8dc; --muted:#9b978e; --gold:#d4a574; --hand:#ffb84d;
  --surface:#1b1a15; --line:rgba(212,165,116,.28); --line-soft:rgba(237,232,220,.09);
  --serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --script:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141410; --ink:#ede8dc; --muted:#9b978e; --gold:#d4a574; --hand:#ffb84d;
    --surface:#1b1a15; --line:rgba(212,165,116,.28); --line-soft:rgba(237,232,220,.09);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141410; --ink:#ede8dc; --muted:#9b978e; --gold:#d4a574; --hand:#ffb84d;
  --surface:#1b1a15; --line:rgba(212,165,116,.28); --line-soft:rgba(237,232,220,.09);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ede8dc; --ink:#1d1c17; --muted:#5f5b51; --gold:#8a5a2c; --hand:#b35c00;
  --surface:#e4ddcd; --line:rgba(138,90,44,.34); --line-soft:rgba(29,28,23,.1);
  color-scheme:light;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.0625rem;line-height:1.8;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hand);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:38rem;margin:0 auto;padding:0 1.25rem}
p{margin:0 0 1.1rem}
.muted{color:var(--muted)}
.small{font-size:.9rem;line-height:1.65}
.hand{font-family:var(--script);font-weight:600;color:var(--hand);line-height:1.15}

/* Acrostiche */
.hero{padding-top:3.2rem;text-align:center}
.acro{display:flex;justify-content:center;align-items:flex-start;gap:.16em;font-size:clamp(2.7rem,12.6vw,7rem)}
.grp{display:flex;flex-direction:column;align-items:stretch}
.letters{display:flex;justify-content:center;gap:.03em}
.lt{font-family:var(--display);font-style:italic;font-weight:300;font-variation-settings:"opsz" 144;font-size:1em;line-height:1.05;background:none;border:0;padding:0 .03em;cursor:pointer;color:transparent;-webkit-text-stroke:1.2px var(--gold)}
.lt.done{color:var(--gold);-webkit-text-stroke:0}
.lt:hover{color:color-mix(in srgb,var(--gold) 30%,transparent)}
.lt.done:hover{color:var(--gold)}
.phase{display:block;font-family:var(--script);font-weight:600;color:var(--hand);font-size:clamp(1.05rem,4.2vw,1.5rem);line-height:1.2;border-top:1px solid var(--line);margin-top:.3rem;padding-top:.2rem}
.acro.play .lt{animation:trail 1.1s cubic-bezier(.2,.65,.2,1) both;animation-delay:calc(var(--i) * 120ms)}
.acro.play .phase{animation:fade 1s 1s both}
@keyframes trail{from{opacity:0;filter:blur(8px);transform:translateX(-.2em)}to{opacity:1;filter:none;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lede{font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(1.25rem,4.8vw,1.7rem);line-height:1.45;max-width:24ch;margin:1.8rem auto 0}

/* Accueil */
.home h2,.blk h2{font-family:var(--display);font-style:italic;font-weight:400;font-size:1.6rem;line-height:1.3;color:var(--gold);margin:3rem 0 .8rem}
.intro{margin-top:2.6rem}
.q-home{font-family:var(--display);font-style:italic;font-size:1.3rem;line-height:1.5;margin:0;padding-left:1rem;border-left:2px solid var(--gold)}
.toc{list-style:none;padding:0;margin:0}
.toc li{border-top:1px solid var(--line-soft)}
.toc li:last-child{border-bottom:1px solid var(--line-soft)}
.toc-row{display:grid;grid-template-columns:2.8rem 1fr auto;gap:.9rem;align-items:start;width:100%;text-align:left;background:none;border:0;padding:1rem .25rem;cursor:pointer}
.toc-row:hover{background:var(--surface)}
.toc-l{font-family:var(--display);font-style:italic;font-weight:300;font-variation-settings:"opsz" 144;font-size:2.5rem;line-height:1;color:transparent;-webkit-text-stroke:1px var(--gold)}
.toc-row.done .toc-l{color:var(--gold);-webkit-text-stroke:0}
.toc-t{display:block;font-family:var(--display);font-size:1.2rem;line-height:1.35}
.toc-d{display:block;font-size:.95rem;line-height:1.6;color:var(--muted);margin-top:.2rem}
.toc-m{display:block;font-family:var(--script);font-weight:600;color:var(--hand);font-size:1.2rem;margin-top:.3rem}
.toc-done{font-family:var(--script);font-weight:600;color:var(--gold);font-size:1.25rem;padding-top:.25rem}
.actions{margin:1.6rem 0 0}
.foot{text-align:center;margin-top:4.5rem;padding-bottom:2.5rem;font-family:var(--display);font-style:italic;color:var(--muted)}

/* Boutons */
.btn{display:inline-block;font-family:var(--display);font-style:italic;font-size:1.1rem;line-height:1.3;background:transparent;color:var(--ink);border:1px solid var(--gold);border-radius:999px;padding:.6rem 1.35rem;cursor:pointer;text-align:center}
.btn:hover{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.btn.primary{background:var(--gold);color:var(--bg)}
.btn.primary:hover{background:color-mix(in srgb,var(--gold) 86%,var(--ink))}
.btn.ghost{border-color:var(--line)}
.link{background:none;border:0;padding:.35rem 0;cursor:pointer;color:var(--gold);font-family:var(--display);font-style:italic;font-size:1.05rem;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:.25em}
.link.quiet{color:var(--muted)}

/* Module */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-top:.35rem;padding-bottom:.35rem}
.mini{display:flex;gap:.55rem;font-size:1.3rem}
.mini .phase{display:none}
.mini .letters{gap:0}
.mini .lt{-webkit-text-stroke:0;color:var(--muted);font-weight:400;padding:.3rem .2rem;line-height:1}
.mini .lt.done{color:var(--gold)}
.mini .lt.cur{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hand);text-underline-offset:.3em;text-decoration-thickness:2px}
.mhead{display:grid;grid-template-columns:auto 1fr;gap:1.1rem;align-items:end;margin-top:2.4rem}
.bigl{font-family:var(--display);font-style:italic;font-weight:300;font-variation-settings:"opsz" 144;font-size:clamp(5.5rem,26vw,9rem);line-height:.8;color:var(--gold)}
.mhead h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(2rem,8vw,3rem);line-height:1.1;margin:.15rem 0 .3rem}
.mhead .hand{font-size:1.4rem;margin:0}
.arc{margin:0;color:var(--muted);font-size:.95rem}
.qremind{margin:2rem 0 0;padding-left:1rem;border-left:2px solid var(--gold)}
.qremind .hand{display:block;font-size:1.2rem}
.qremind p{font-family:var(--display);font-style:italic;font-size:1.2rem;line-height:1.5;margin:.1rem 0 0}
.mintro{margin-top:2rem}
.margin-note{font-family:var(--script);font-weight:600;color:var(--hand);font-size:1.5rem;line-height:1.2;transform:rotate(-1.6deg);margin:.4rem 0 0 1.2rem}
.blk h3{font-family:var(--display);font-style:italic;font-weight:400;font-size:1.3rem;line-height:1.35;margin:0 0 .7rem}

/* Pyramide */
.pyr{margin:.4rem 0 1.4rem}
.pyr-row{display:grid;grid-template-columns:4.4rem 1fr;gap:.8rem;align-items:start;padding:.45rem 0}
.pyr-k{font-family:var(--script);font-weight:600;color:var(--hand);font-size:1.35rem;line-height:1.3}
.pyr-v{position:relative;padding-top:.7rem;line-height:1.6}
.pyr-bar{position:absolute;top:0;left:0;height:2px;width:var(--w);background:var(--gold);border-radius:2px}

/* Champs */
.field{display:block;margin:1.2rem 0}
.field>span,.c-l{display:block;font-size:.92rem;color:var(--muted);margin-bottom:.25rem;line-height:1.5}
.field input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;padding:.35rem 0}
.field input:focus,.lined:focus{border-color:var(--gold)}
.lined{display:block;width:100%;background-color:transparent;background-image:linear-gradient(to bottom,transparent calc(2rem - 1px),var(--line) calc(2rem - 1px),var(--line) 2rem);background-size:100% 2rem;background-attachment:local;line-height:2rem;font-family:var(--serif);font-size:1rem;color:var(--ink);border:0;padding:0 .25rem;resize:vertical}
.qfield .lined{font-family:var(--display);font-style:italic;font-size:1.15rem}

/* Tirage */
.slots{display:flex;gap:.9rem;margin:1.3rem 0 .8rem}
.slot-wrap{flex:0 1 8rem;min-width:0;margin:0}
.slot-wrap figcaption{font-family:var(--script);font-weight:600;color:var(--hand);font-size:1.15rem;line-height:1.1;text-align:center;min-height:2.6em;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.35rem}
.slot{aspect-ratio:5/8;border-radius:.55rem;border:1px solid var(--line);background:var(--surface);box-shadow:inset 0 0 0 6px var(--bg),inset 0 0 0 7px var(--line);display:grid;place-items:center;padding:.9rem .4rem;text-align:center;font-family:var(--display);font-style:italic;font-size:clamp(.82rem,3.5vw,1rem);line-height:1.25;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.slot:empty::after{content:"";width:1.5rem;height:1.5rem;border:1px solid var(--line);border-radius:50%}
.slot.face{border-color:var(--gold)}
.slot.turn{animation:reveal .55s cubic-bezier(.3,.7,.3,1) both;animation-delay:calc(var(--k) * 140ms)}
@keyframes reveal{from{transform:scaleX(.03);opacity:.4}to{transform:none;opacity:1}}

/* Souffle */
.breath{display:grid;justify-items:center;gap:.3rem;margin:1.4rem 0 .4rem}
.breath svg{width:min(12.5rem,58vw);height:auto}
.rb{fill:none;stroke:var(--line);stroke-width:1}
.rc{fill:var(--gold);fill-opacity:.12;stroke:var(--gold);stroke-width:1;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center}
.bt{font-family:var(--display);font-style:italic;font-size:1.4rem;margin:.2rem 0 0;min-height:1.8em}
.bc{margin:0 0 .6rem;min-height:1.4em}

/* Induction */
.ind{border:1px solid var(--line);border-radius:1rem;background:var(--surface);padding:1.5rem 1.3rem;min-height:13rem;display:grid;align-content:space-between;gap:1.1rem;margin:1.2rem 0 1rem}
.ind-line{font-family:var(--display);font-style:italic;font-size:clamp(1.2rem,4.6vw,1.42rem);line-height:1.55;margin:0;transition:opacity .6s ease}
.ind-line.fade{opacity:0}
.ind-ctrl{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.ind-prog{margin:0}
details.full{margin:.4rem 0 1rem}
details.full summary{cursor:pointer;font-family:var(--display);font-style:italic;color:var(--gold)}
details.full ol{padding-left:1.4rem;margin:.8rem 0 0}
details.full li{margin-bottom:.45rem}

/* Semaine, arcane, nez */
.blk{scroll-margin-top:4.4rem}
.dcount{font-size:1.2rem;margin-left:.7rem}
.days{list-style:none;padding:0;margin:1rem 0 0}
.day{display:grid;grid-template-columns:2.4rem 3.4rem 1fr;align-items:center;gap:.3rem;border-top:1px solid var(--line-soft)}
.day:last-child{border-bottom:1px solid var(--line-soft)}
.day-t{width:2.4rem;height:2.6rem;background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center}
.day-t::before{content:"";width:1.2rem;height:1.2rem;border:1px solid var(--gold);border-radius:50%}
.day.on .day-t::before{background:var(--gold);box-shadow:inset 0 0 0 3px var(--bg)}
.day-n{font-family:var(--script);font-weight:600;color:var(--hand);font-size:1.2rem;line-height:1}
.day-go{background:none;border:0;padding:.55rem 0;text-align:left;cursor:pointer;font-size:.98rem;line-height:1.45}
.day-go:hover{color:var(--gold)}
.day.on .day-go{color:var(--muted)}
.ee{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1.1rem;margin:1.3rem 0 0}
.ee>div{border-top:1px solid var(--line);padding-top:.4rem}
.ee dt{font-family:var(--script);font-weight:600;color:var(--hand);font-size:1.35rem;line-height:1.2}
.ee dd{margin:.15rem 0 0;line-height:1.65}
.try{border-left:2px solid var(--line);padding-left:1rem;margin-top:1.3rem}
.try .hand{display:block;font-size:1.3rem;margin-bottom:.2rem}
.coince p{font-style:italic}

/* Carnet */
.carnet .c-item{display:block;margin:1.4rem 0}
.saved{font-size:1.15rem;margin-left:.6rem;opacity:0;transition:opacity .4s}
.saved.on{opacity:1}
.compile{margin-top:1.4rem}
.compile .ctrl{display:flex;gap:.7rem;flex-wrap:wrap}
.compiled{margin-top:1.4rem;border-left:2px solid var(--line);padding-left:1rem}
.compiled h4{font-family:var(--display);font-style:italic;font-weight:400;color:var(--gold);font-size:1.2rem;margin:1.6rem 0 .3rem}
.compiled h4:first-child{margin-top:0}
.compiled .cl{font-size:.88rem;color:var(--muted);margin:.7rem 0 0}
.compiled .cv{white-space:pre-wrap;margin:.1rem 0 0}
.copybox{width:100%;min-height:10rem;margin-top:1rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:.5rem;padding:.7rem;font:inherit;font-size:.9rem}
.copymsg{min-height:1.4em;margin:.6rem 0 0;font-size:1.2rem}

/* Pied de module */
.mfoot{margin-top:3.2rem;border-top:1px solid var(--line-soft);padding-top:1.4rem;padding-bottom:3rem}
.done-t{display:flex;align-items:center;gap:.7rem;background:none;border:0;padding:.4rem 0;cursor:pointer;text-align:left}
.done-t::before{content:"";flex:0 0 1.2rem;height:1.2rem;border:1px solid var(--gold);border-radius:50%}
.done-t[aria-pressed="true"]::before{background:var(--gold);box-shadow:inset 0 0 0 3px var(--bg)}
.pn{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:1.5rem}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
(function(){
"use strict";

/* Paires ArcanEssence à reprendre de la parfumothèque.
   Laissées vides, la page propose seulement l'accord et invite à choisir un flacon sur l'étagère. */
var PAIRES = {
  s:  {accessible:"", niche:""},

  l2: {accessible:"", niche:""},
  a:  {accessible:"", niche:""},
  g:  {accessible:"", niche:""},
  e:  {accessible:"", niche:""}
};

var MAJ = ["Le Fou","Le Magicien","La Grande Prêtresse","L’Impératrice","L’Empereur","Le Hiérophante","Les Amoureux","Le Chariot","La Force","L’Ermite","La Roue de Fortune","La Justice","Le Pendu","La Mort","La Tempérance","Le Diable","La Tour","L’Étoile","La Lune","Le Soleil","Le Jugement","Le Monde"];
var RANGS = ["As","Deux","Trois","Quatre","Cinq","Six","Sept","Huit","Neuf","Dix","Valet","Cavalier","Reine","Roi"];
var SUITES = ["de Coupes","de Bâtons","d’Épées","de Deniers"];
var DECK = MAJ.slice();
SUITES.forEach(function(s){ RANGS.forEach(function(r){ DECK.push(r+" "+s); }); });

var ORDER = ["s","i","l1","l2","a","g","e"];
var GROUPS = [["entrée",["s","i"]],["seuil",["l1","l2","a"]],["sortie",["g","e"]]];

var M = {
 s:{ l:"S", t:"Sentir", week:1, phase:"entrée", arc:"Le Fou", num:"0",
  d:"Approcher les cartes par le nez et les yeux, sans rien apprendre.",
  intro:[
   "Le Fou part avec son baluchon, un petit chien sur les talons, et regarde le ciel plutôt que le bord de la falaise. Pour commencer, je vous demande un peu de sa légèreté. Cette semaine, vous n’avez aucune signification à apprendre et aucun livre à ouvrir à côté du jeu.",
   "Vous allez approcher les cartes comme on découvre un parfum sur une touche, avant d’en lire la composition : avec le nez d’abord, les yeux ensuite. Le sens viendra plus tard, et il sera plus juste s’il part de ce que vous avez vraiment vu."
  ],
  note:"le premier jour, on écrit toujours trop peu. c’est normal.",
  accord:{e:"zeste de pamplemousse, menthe froissée entre les doigts", s:"fleur d’oranger", f:"musc propre, linge qui sèche dehors"},
  flacon:"Un parfum frais, de ceux qu’on met sans réfléchir un matin de départ.",
  ex:{ title:"Une carte par jour",
   p:[
    "Chaque jour de la semaine, tirez une carte sans poser de question. Respirez votre flacon, puis regardez l’image pendant une minute entière, ce qui dure plus longtemps qu’on ne croit.",
    "Écrivez ensuite cinq minutes sans vous arrêter : une couleur, un détail du dessin, un souvenir, l’odeur qu’aurait la carte si elle était un parfum. Laissez de côté ce qu’elle est censée vouloir dire."
   ],
   draw:{n:1, labels:["carte du jour"]} },
  ritual:{type:"souffle"},
  carnet:[
   {k:"p1", l:"Les cartes de la semaine, jour après jour", big:true},
   {k:"p2", l:"L’odeur qui revient le plus souvent dans ce que j’ai écrit"}
  ]
 },
 i:{ l:"I", t:"Inventaire", week:2, phase:"entrée", arc:"L’Ermite", num:"IX",
  d:"Poser la question de départ et faire le compte de ce qui retient et de ce qui nourrit.",
  intro:[
   "L’Ermite lève sa lanterne juste assez pour voir où poser le pied suivant. La montagne entière peut attendre. Cette semaine, vous faites comme lui : vous posez votre question de départ, puis vous regardez ce que vous avez déjà sous la main.",
   "Prenez le temps de la formuler, puisqu’elle vous accompagnera jusqu’au bout. Une bonne question tient en une phrase et parle de vous. « Comment donner forme à mon atelier de céramique ? » vous laisse de quoi travailler. « Est-ce que ça va marcher ? » attend un oui ou un non, et vous laisse les mains vides."
  ],
  note:"si la question tient sur deux lignes, coupez.",
  accord:{e:"cardamome, écorce de bergamote", s:"vétiver, feuille de thé", f:"bois fumé, cire de bougie"},
  flacon:"Quelque chose de sec et de silencieux, qui se porte près de la peau.",
  ex:{ title:"Le tirage de la lanterne", question:true,
   p:[

    "Lisez-les dans l’ordre, puis relisez-les de droite à gauche. La carte de ce qui attend change souvent la façon dont on regarde ce qui retient."
   ],
   draw:{n:3, labels:["ce qui retient","ce qui nourrit","ce qui attend d’être pris"]} },
  ritual:{type:"souffle"},
  carnet:[
   {k:"p1", l:"Ce qui retient : la carte, et ce qu’elle me montre"},
   {k:"p2", l:"Ce qui nourrit"},
   {k:"p3", l:"Ce qui attend d’être pris"}
  ]
 },
 l1:{ l:"L", t:"Lire en personnages", week:3, phase:"seuil", arc:"Le Magicien", num:"I",
  d:"Donner une voix aux arcanes et les laisser discuter du projet.",

/* Typographie française : espaces insécables avant la ponctuation double et dans les guillemets */
function typo(v){
  if(typeof v==="string") return v.replace(/ ([?!;:»])/g,"\u00a0$1").replace(/« /g,"«\u00a0");
  if(Array.isArray(v)) return v.map(typo);
  if(v && typeof v==="object"){ Object.keys(v).forEach(function(k){ v[k]=typo(v[k]); }); return v; }
  return v;
}

/* Tirage */
function rnd(n){
  if(window.crypto && crypto.getRandomValues){ var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  return Math.floor(Math.random()*n);
}
function doDraw(root){
  var id = root.getAttribute("data-draw"), d = M[id].ex.draw;
  var pool = DECK.slice(), picked = [];
  for(var k=0;k<d.n;k++){ picked.push(pool.splice(rnd(pool.length),1)[0]); }
  store.draws[id] = picked; save();
  var slots = root.querySelectorAll(".slot");
  slots.forEach(function(s,k){
    s.classList.remove("turn"); void s.offsetWidth;
    s.innerHTML = '<span>'+esc(picked[k])+'</span>';
    s.classList.add("face","turn");
  });
  root.querySelector('[data-act="draw"]').textContent = "Tirer à nouveau";
}

    var rc = bRoot.querySelector(".rc"); rc.style.transition = "transform 1.2s ease"; rc.style.transform = "scale(1)";
    bRoot.querySelector('[data-act="breath"]').textContent = "Commencer";

  if(bRoot===root){ stopBreath(); root.querySelector(".bt").textContent = "Flacon en main"; root.querySelector(".bc").textContent = ""; return; }
  stopBreath(); stopInd();

  root.querySelector('[data-act="breath"]').textContent = "Arrêter";

  var cycle = 0, p = 0;
  function step(){
    if(!root.isConnected){ stopBreath(); return; }
    if(p===0){ cycle++; if(cycle>6){ stopBreath(); bt.textContent = "Vous pouvez reposer le flacon"; bc.textContent = ""; return; } bc.textContent = "cycle "+cycle+" sur 6"; }
    var ph = phases[p];
    bt.textContent = ph[0];
    rc.style.transition = "transform "+ph[1]+"ms ease-in-out";
    rc.style.transform = "scale("+ph[2]+")";
    bTimer = setTimeout(function(){ p = (p+1)%3; step(); }, ph[1]);
  }
  step();
}

/* Induction */
var iState = null;
function stopInd(){
  if(iState){ clearTimeout(iState.t); iState = null; }
}
function indShow(st){
  var line = st.root.querySelector(".ind-line"), prog = st.root.querySelector(".ind-prog");
  line.classList.add("fade");
  setTimeout(function(){
    if(!st.root.isConnected) return;
    line.textContent = st.lines[st.i];
    line.classList.remove("fade");
  }, 450);
  prog.textContent = (st.i+1)+" sur "+st.lines.length;
}
function indSchedule(st){
  clearTimeout(st.t);
  if(st.paused) return;
  var words = st.lines[st.i].split(/\s+/).length;
  st.t = setTimeout(function(){ indNext(st); }, Math.max(7000, words*620));
}
function indNext(st){
  if(!st.root.isConnected){ stopInd(); return; }
  if(st.i >= st.lines.length-1){
    clearTimeout(st.t);
    var line = st.root.querySelector(".ind-line");
    line.textContent = "Fin du texte. Prenez un moment avant de revenir au carnet.";
    st.root.querySelector(".ind-prog").textContent = "";
    st.root.querySelector('[data-act="ind"]').textContent = "Recommencer";
    st.root.querySelector('[data-act="indnext"]').hidden = true;
    st.ended = true; st.paused = true;
    return;
  }
  st.i++; indShow(st); indSchedule(st);
}
function toggleInd(root){
  var id = current, lines = M[id].ritual.lines;
  var btn = root.querySelector('[data-act="ind"]');
  if(!iState || iState.root!==root || iState.ended){
    stopBreath(); stopInd();
    iState = {root:root, lines:lines, i:0, paused:false, t:null, ended:false};
    indShow(iState); indSchedule(iState);
    btn.textContent = "Pause";
    root.querySelector('[data-act="indnext"]').hidden = false;
    return;
  }
  iState.paused = !iState.paused;
  btn.textContent = iState.paused ? "Reprendre" : "Pause";
  if(iState.paused) clearTimeout(iState.t); else indSchedule(iState);
}

/* Carnet complet */
function compileParts(){
  var out = [];
  var q = (store.question||"").trim();
  ORDER.forEach(function(id){
    var m = M[id], c = store.carnet[id] || {}, dr = store.draws[id] || [];
    var items = [];
    if(c.flacon && c.flacon.trim()) items.push(["Le flacon", c.flacon.trim()]);
    if(dr.length) items.push(["Tirage dans la page", dr.join(", ")]);
    m.carnet.forEach(function(p){ var v = (c[p.k]||"").trim(); if(v) items.push([p.l, v]); });
    if(items.length) out.push({title:"Semaine "+m.week+"\u00a0: "+m.t+" ("+m.arc+")", items:items});
  });
  return {q:q, parts:out};
}
function compileText(){
  var d = compileParts(), t = "SILLAGE, mon carnet\nUn parcours © ArcanEssence 2026\n\n";
  if(d.q) t += "Ma question\u00a0: "+d.q+"\n\n";
  d.parts.forEach(function(p){
    t += p.title+"\n";
    p.items.forEach(function(it){ t += "\n"+it[0]+"\n"+it[1]+"\n"; });
    t += "\n\n";
  });
  return t;
}
function showCompiled(root){
  var box = root.querySelector(".compiled"), btn = root.querySelector('[data-act="compile"]');
  if(!box.hidden){ box.hidden = true; btn.textContent = "Afficher le carnet complet"; return; }
  var d = compileParts();
  var h = d.q ? '<h4>Ma question</h4><p class="cv">'+esc(d.q)+'</p>' : '';
  if(!d.parts.length && !d.q) h = '<p class="muted">Le carnet est encore vide. Il se remplit au fil des modules.</p>';
  d.parts.forEach(function(p){
    h += '<h4>'+esc(p.title)+'</h4>' + p.items.map(function(it){ return '<p class="cl">'+esc(it[0])+'</p><p class="cv">'+esc(it[1])+'</p>'; }).join('');
  });
  box.innerHTML = h; box.hidden = false; btn.textContent = "Masquer le carnet";
}
function copyAll(root){
  var txt = compileText(), msg = root.querySelector(".copymsg");
  function fallback(){
    var ta = root.querySelector(".copybox"); ta.hidden = false; ta.value = txt; ta.focus(); ta.select();
    msg.textContent = "sélectionnez le texte ci-dessous et copiez-le";
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ msg.textContent = "carnet copié"; }, fallback);
    } else fallback();
  }catch(e){ fallback(); }
}
function saveFile(root){
  var msg = root.querySelector(".copymsg");
  if(!downloads){ msg.textContent = "enregistrement indisponible ici"; return; }
  downloads.save({filename:"carnet-sillage.txt", data:compileText()}).then(function(r){
    if(r && r.status==="saved") msg.textContent = "carnet enregistré";
  }, function(err){
    var code = err && err.code;
    if(code==="declined") msg.textContent = "";
    else if(code==="rate_limited") msg.textContent = "une fenêtre est déjà ouverte, réessayez dans un instant";
    else { msg.textContent = "enregistrement indisponible ici"; var b = root.querySelector('[data-act="dl"]'); if(b) b.hidden = true; }
  });
}

/* Événements */
var savedT = null;
function flashSaved(){
  var s = app.querySelector(".saved"); if(!s) return;
  s.textContent = canStore ? "enregistré" : "non enregistré sur cet appareil";
  s.classList.add("on");
  clearTimeout(savedT); savedT = setTimeout(function(){ s.classList.remove("on"); }, 1400);
}
var saveT = null;
app.addEventListener("input", function(e){
  var t = e.target;
  if(t.hasAttribute("data-q")){ store.question = t.value; }
  else if(t.hasAttribute("data-k") && current!=="home"){
    (store.carnet[current] || (store.carnet[current] = {}))[t.getAttribute("data-k")] = t.value;
  } else return;
  clearTimeout(saveT); saveT = setTimeout(function(){ save(); flashSaved(); }, 450);
});

app.addEventListener("click", function(e){
  var g = e.target.closest("[data-go]");
  if(g){ go(g.getAttribute("data-go")); return; }
  var sc = e.target.closest("[data-scroll]");
  if(sc){ scrollToSec(sc.getAttribute("data-scroll")); return; }
  var a = e.target.closest("[data-act]"); if(!a) return;
  var act = a.getAttribute("data-act");
  if(act==="draw") doDraw(a.closest("[data-draw]"));
  else if(act==="breath") startBreath(a.closest("[data-breath]"));
  else if(act==="ind") toggleInd(a.closest("[data-ind]"));
  else if(act==="indnext"){ if(iState){ indNext(iState); } }
  else if(act==="done"){
    store.done[current] = !store.done[current]; save();
    var d = !!store.done[current];
    a.setAttribute("aria-pressed", String(d));
    a.textContent = d ? "Module terminé" : "Marquer ce module comme terminé";
    app.querySelectorAll('.mini .lt[data-go="'+current+'"]').forEach(function(l){ l.classList.toggle("done", d); });
  }
  else if(act==="day"){
    var n = +a.getAttribute("data-n");
    var arr = store.days[current] || (store.days[current] = []);
    arr[n] = !arr[n]; save();
    a.setAttribute("aria-pressed", String(!!arr[n]));
    a.closest(".day").classList.toggle("on", !!arr[n]);
    var cnt = app.querySelector(".dcount"); if(cnt) cnt.textContent = arr.filter(Boolean).length+" sur 7";
  }
  else if(act==="compile") showCompiled(a.closest(".compile"));
  else if(act==="copy") copyAll(a.closest(".compile"));
  else if(act==="dl") saveFile(a.closest(".compile"));
  else if(act==="reset"){
    if(a.getAttribute("data-armed")){
      store = blank();
      try{ window.localStorage.removeItem(KEY); }catch(err){}
      renderHome();
    } else {
      a.setAttribute("data-armed","1");
      a.textContent = "Confirmer\u00a0: tout effacer";
      setTimeout(function(){ if(a.isConnected){ a.removeAttribute("data-armed"); a.textContent = "Effacer mon carnet"; } }, 4000);
    }
  }
});

window.addEventListener("hashchange", function(){
  var hh = (location.hash||"").replace("#","");
  if(hh !== current && (M[hh] || hh==="home")) go(hh);
});

/* Démarrage */
var h = (location.hash||"").replace("#","");
go(M[h] ? h : "home");

/* Enregistrement du carnet : capacité du lecteur Claude si elle existe, sinon téléchargement classique (GitHub Pages, fichier local) */
var hasClaude = false;
try{ hasClaude = !!(window.claude && typeof window.claude.use === "function"); }catch(e){}
function showDl(){ var b = app.querySelector('[data-act="dl"]'); if(b) b.hidden = false; }
if(hasClaude){
  try{
    window.claude.use("downloads").then(function(ns){ downloads = ns || null; if(downloads) showDl(); }, function(){ downloads = null; });
  }catch(e){ downloads = null; }
} else if(window.Blob && window.URL && URL.createObjectURL){
  downloads = { save: function(o){
    return new Promise(function(res, rej){
      try{
        var blob = new Blob(["\ufeff" + o.data], {type:"text/plain;charset=utf-8"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = o.filename; a.style.display = "none";
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
        res({status:"saved"});
      }catch(err){ rej({code:"unavailable"}); }
    });
  }};
  showDl();
}

})();
</script>
